                <button id="exportCSV">Export Table to CSV</button>

            </div>
            
            <table class="stocksummary" id="stocksummary">
                <thead>
                    <tr>
                        <th>LPN</th> <!--LPN is short for Licence Plate Number-->
                        <th>SKU</th>
                        <th>Location</th>
                        <th>Quantity</th>

                        <th class="noMobile">Product Version</th>

                        <th class="noMobile">Make</th>
                        <th class="noMobile">Model</th>
                        <th class="noMobile">Weight</th>
                        <th class="noMobile">Length</th>
                        <th class="noMobile">Width</th>
                        <th class="noMobile">Height</th>
                        <th class="noMobile">Cost per Item</th>
                        <th class="noMobile">Item Sale Price</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- table rows here -->
                 </tbody>
            </table>
        </div>
