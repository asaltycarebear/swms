<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Garrett Stockwell">
    
    <meta name="description" content="View a complete summary of all inventory items, including SKU details, quantities, locations, specifications, and pricing.">
    <title>Stockwell Inventory – Summary</title>
    <meta property="og:type" content="website">
    
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/styles-large.css">
    <link rel="stylesheet" href="styles/summary.css">
    
    <script type="module"  src="scripts/getdates.js" defer></script>
    <script type="module" src="scripts/main.js"></script>
    <script type="module"  src="scripts/summary.js" defer></script>

    <link rel="icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Quantico&display=swap" rel="stylesheet">
</head>
<body>
    <header id="header-main"></header>
    
    <main>
        <div class="table-container">
            
            <div class="action">
                <button id="loadTable">Load Table</button>
                <button id="clearTable">Clear Table</button>
                <button id="exportCSV">Export Table to CSV</button>
                <label for="clearAfterExport">Clear table after export: <input type="checkbox" id="clearAfterExport"></label>
            </div>
            
            <table class="stocksummary" id="stocksummary">
                <thead>
                    <tr>
                        <th>LPN</th> <!--LPN is short for Licence Plate Number-->
                        <th>SKU</th>
                        <th>Location</th>
                        <th>Quantity</th>
                        <th class="noMobile">Batch Lot</th>
                        <th class="noMobile">Product Version</th>
                        <th class="noMobile">Description</th>
                        <th class="noMobile">Make</th>
                        <th class="noMobile">Model</th>
                        <th class="noMobile">Weight</th>
                        <th class="noMobile">Length</th>
                        <th class="noMobile">Width</th>
                        <th class="noMobile">Height</th>
                        <th class="noMobile">Cost per Item</th>
                        <th class="noMobile">Item Sale Price</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- table rows here -->
                 </tbody>
            </table>
        </div>

        <div id="modalContainer"></div>
    
    </main>

    <footer id="footer-main"></footer>
</body>
</html>
