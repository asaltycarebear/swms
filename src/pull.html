<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Garrett Stockwell">

    <meta name="description" content="A tool for Removing L P Ns from the lpn and location json files.">
    <title>Stockwell Inventory Pull deletion tool</title>
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/styles-large.css">
    <link rel="stylesheet" href="styles/pull.css">
    <link rel="stylesheet" href="styles/forms.css">

    <script type="module" src="scripts/getdates.js" defer></script>
    <script type="module" src="scripts/main.js"></script>
    <script type="module" src="scripts/pull.js" defer></script>

    <link rel="icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Quantico&display=swap"
        rel="stylesheet">
</head>

<body>
    <header id="header-main"></header>

    <main>
        <section class="pull-container">
    
            <form id="pullForm">
                <label for="lpnInput">LPN Number</label>
                <input type="text" id="lpnInput" name="lpn" placeholder="Enter LPN number" required>
    
                <button type="submit" id="pullButton">Pull LPN</button>
            </form>
    
            <p id="moveMessage" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer id="footer-main"></footer>
</body>

</html>
